; CYD Stream Deck firmware
; LCDWiki/Hosyond 4.0-inch ESP32-32E E32R40T (same hardware as the Clocky project)
; ST7796S 320x480 + XPT2046 on a shared SPI bus

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = COM4
monitor_port = COM4

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    bblanchon/ArduinoJson @ ^7.2.0

build_flags =
    -D USER_SETUP_LOADED
    -D ST7796_DRIVER
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_MOSI=13
    -D TFT_MISO=12
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=27
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D LOAD_FONT4

board_build.partitions = no_ota.csv
board_build.filesystem = littlefs
